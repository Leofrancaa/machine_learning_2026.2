[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_reconhecimento"
version = "0.0.1"
description = "Controle de acesso por reconhecimento facial com OpenCV e DeepFace"
authors = [
  { name = "Leonardo F" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "deepface[tensorflow]>=0.0.101",
    "loguru",
    "mkdocs",
    "numpy>=2.5.3",
    "opencv-python>=4.8,<5",
    "pandas>=3.0.6",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "tf-keras>=2.21.0",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["module_reconhecimento"]
include = ["pyproject.toml", "module_reconhecimento/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_reconhecimento"]
force-sort-within-sections = true

