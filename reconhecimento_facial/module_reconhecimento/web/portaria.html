<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portaria Virtual</title>
<style>
  /* ---------- Cores e base ---------- */
  :root {
    --bg: #0b0f16;
    --panel: #121822;
    --panel-2: #18202c;
    --line: #253043;
    --text: #e6ebf2;
    --muted: #8a96a8;
    --accent: #4da3ff;
    --ok: #2fd27a;
    --no: #ff4d5e;
    --warn: #ffb547;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: grid;
    grid-template-columns: 380px 1fr;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }

  /* ---------- Painel lateral ---------- */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header { padding: 18px 20px 12px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }

  .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: 0; padding: 10px 12px; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  .content { padding: 18px 20px 24px; overflow-y: auto; flex: 1; }
  .view[hidden] { display: none; }

  label.field { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; padding: 10px 12px; border-radius: var(--radius);
    background: var(--panel-2); border: 1px solid var(--line); outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  /* Área para soltar fotos */
  .drop {
    display: block; margin-top: 14px; padding: 18px; border-radius: var(--radius);
    border: 1.5px dashed var(--line); background: var(--panel-2);
    text-align: center; color: var(--muted); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: #1b2433; }
  .drop strong { color: var(--text); font-weight: 600; }
  .drop input { display: none; }

  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .thumbs:empty { display: none; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.7); cursor: pointer; line-height: 1; padding: 0;
  }

  .btn {
    width: 100%; margin-top: 14px; padding: 11px 14px; border-radius: var(--radius);
    border: 0; background: var(--accent); color: #04121f; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .msg { margin-top: 10px; font-size: 13px; min-height: 1.4em; }
  .msg.ok { color: var(--ok); }
  .msg.no { color: var(--no); }
  .msg.info { color: var(--muted); }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; }

  /* Lista de pessoas cadastradas */
  .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .person {
    display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center;
    padding: 8px; border-radius: var(--radius); background: var(--panel-2);
  }
  .person img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
  .person small { color: var(--muted); display: block; }
  .person button {
    background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
    cursor: pointer; color: var(--muted); font-size: 12px;
  }
  .person button.confirm { border-color: var(--no); color: var(--no); }
  .empty { color: var(--muted); font-size: 13px; }

  /* Resultado do teste de acesso */
  .preview { position: relative; margin-top: 12px; border-radius: var(--radius); overflow: hidden; background: #000; }
  .preview[hidden] { display: none; }
  .preview canvas { width: 100%; display: block; }
  .result {
    margin-top: 12px; padding: 12px 14px; border-radius: var(--radius);
    background: var(--panel-2); border-left: 4px solid var(--line);
  }
  .result[hidden] { display: none; }
  .result.ok { border-left-color: var(--ok); }
  .result.no { border-left-color: var(--no); }
  .result.warn { border-left-color: var(--warn); }
  .result b { display: block; font-size: 15px; }
  .result span { color: var(--muted); font-size: 12.5px; }
  .log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; color: var(--muted); display: grid; gap: 4px; }
  .log li::before { content: "● "; }
  .log li.ok::before { color: var(--ok); }
  .log li.no::before { color: var(--no); }
  .log li.warn::before { color: var(--warn); }

  /* ---------- Cena 3D ---------- */
  main { position: relative; min-width: 0; min-height: 0; }
  #scene { position: absolute; inset: 0; }
  #scene canvas { display: block; }
  .banner {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    padding: 10px 22px; border-radius: 999px; font-weight: 700; letter-spacing: .06em;
    background: rgba(10, 14, 20, .78); border: 1px solid var(--line);
    backdrop-filter: blur(6px); white-space: nowrap; transition: color .2s, border-color .2s;
  }
  .banner.ok { color: var(--ok); border-color: var(--ok); }
  .banner.no { color: var(--no); border-color: var(--no); }
  .banner.warn { color: var(--warn); border-color: var(--warn); }
  .banner.scan { color: var(--accent); border-color: var(--accent); }
  .hint {
    position: absolute; bottom: 14px; right: 16px; color: var(--muted); font-size: 12px;
    background: rgba(10, 14, 20, .6); padding: 6px 10px; border-radius: 8px;
  }

  /* Celular: painel em cima, cena embaixo */
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 55vh; overflow: auto; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { height: 55vh; }
    .banner { font-size: 12px; padding: 8px 14px; }
  }
</style>
</head>
<body>

<aside>
  <header>
    <h1>Portaria Virtual</h1>
    <p>Reconhecimento facial com DeepFace (Facenet512)</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="cadastro">Cadastro</button>
    <button class="tab" role="tab" aria-selected="false" data-view="portaria">Portaria</button>
  </nav>

  <div class="content">

    <!-- ===== Aba de cadastro ===== -->
    <section class="view" id="view-cadastro">
      <label class="field" for="nome">Nome da pessoa</label>
      <input type="text" id="nome" maxlength="40" placeholder="Ex.: Maria Souza" autocomplete="off">

      <label class="drop" id="drop-cadastro">
        <input type="file" id="fotos-cadastro" accept="image/*" multiple>
        <strong>Escolha ou arraste fotos</strong><br>
        De 3 a 5 fotos de frente, bem iluminadas
      </label>
      <div class="thumbs" id="thumbs-cadastro"></div>

      <button class="btn" id="btn-cadastrar" disabled>Cadastrar pessoa</button>
      <div class="msg" id="msg-cadastro"></div>

      <h2>Pessoas autorizadas</h2>
      <ul class="people" id="lista-pessoas"></ul>
    </section>

    <!-- ===== Aba da portaria ===== -->
    <section class="view" id="view-portaria" hidden>
      <label class="drop" id="drop-portaria">
        <input type="file" id="foto-portaria" accept="image/*">
        <strong>Foto de quem está na portaria</strong><br>
        Escolha ou arraste uma foto
      </label>

      <div class="preview" id="preview" hidden><canvas id="preview-canvas"></canvas></div>

      <button class="btn" id="btn-verificar" disabled>Verificar acesso</button>
      <div class="result" id="resultado" hidden></div>
      <div class="msg" id="msg-portaria"></div>

      <h2>Histórico</h2>
      <ul class="log" id="historico"><li class="empty">Nenhuma tentativa ainda.</li></ul>
    </section>
  </div>
</aside>

<main>
  <div id="scene"></div>
  <div class="banner" id="banner">AGUARDANDO</div>
  <div class="hint">Arraste para girar · role para aproximar</div>
</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* =========================================================
   1. Comunicação com o servidor (module_reconhecimento/portaria.py)
   ========================================================= */

async function api(path, body) {
  let response, data;
  try {
    response = await fetch(path, body === undefined ? {} : {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    data = await response.json();
  } catch {
    // Servidor desligado ou erro inesperado (o detalhe aparece no terminal).
    throw new Error("Sem resposta do servidor. Veja o terminal.");
  }
  if (!response.ok) throw new Error(data.erro || "Erro no servidor.");
  return data;
}

// Reduz a foto para no máximo 1280 px e converte para JPEG em base64.
// Fotos de celular são grandes; isso deixa o envio e o reconhecimento mais rápidos.
async function fileToDataUrl(file, maxSide = 1280) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch {
    throw new Error(`Não consegui abrir "${file.name}". Use JPG, PNG ou WEBP.`);
  }
  const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.92);
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

const $ = (id) => document.getElementById(id);

function setMsg(el, text, kind = "info") {
  el.textContent = text;
  el.className = `msg ${kind}`;
}

// Liga uma área de "soltar arquivos" ao input de arquivo escondido dentro dela.
function setupDrop(dropEl, inputEl, onFiles) {
  inputEl.addEventListener("change", () => { onFiles([...inputEl.files]); inputEl.value = ""; });
  dropEl.addEventListener("dragover", (e) => { e.preventDefault(); dropEl.classList.add("over"); });
  dropEl.addEventListener("dragleave", () => dropEl.classList.remove("over"));
  dropEl.addEventListener("drop", (e) => {
    e.preventDefault();
    dropEl.classList.remove("over");
    onFiles([...e.dataTransfer.files]);
  });
}

/* =========================================================
   2. Abas
   ========================================================= */

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t === tab));
    document.querySelectorAll(".view").forEach((v) => (v.hidden = v.id !== `view-${tab.dataset.view}`));
  });
});

/* =========================================================
   3. Cadastro
   ========================================================= */

let fotosCadastro = []; // fotos escolhidas, em base64

function renderThumbs() {
  const box = $("thumbs-cadastro");
  box.innerHTML = "";
  fotosCadastro.forEach((src, i) => {
    const div = document.createElement("div");
    div.className = "thumb";
    div.innerHTML = `<img alt=""><button title="Remover foto">✕</button>`;
    div.querySelector("img").src = src;
    div.querySelector("button").onclick = (e) => {
      e.preventDefault();
      fotosCadastro.splice(i, 1);
      renderThumbs();
    };
    box.appendChild(div);
  });
  updateCadastroButton();
}

function updateCadastroButton() {
  $("btn-cadastrar").disabled = !$("nome").value.trim() || fotosCadastro.length === 0;
}

setupDrop($("drop-cadastro"), $("fotos-cadastro"), async (files) => {
  setMsg($("msg-cadastro"), "");
  for (const file of files) {
    try {
      fotosCadastro.push(await fileToDataUrl(file));
    } catch (error) {
      setMsg($("msg-cadastro"), error.message, "no");
    }
  }
  renderThumbs();
});

$("nome").addEventListener("input", updateCadastroButton);

$("btn-cadastrar").addEventListener("click", async () => {
  const btn = $("btn-cadastrar");
  btn.disabled = true;
  btn.textContent = "Gerando banco de rostos...";
  setMsg($("msg-cadastro"), "O DeepFace está gerando os embeddings. Isso leva alguns segundos.");

  try {
    const data = await api("/api/cadastro", { nome: $("nome").value, fotos: fotosCadastro });
    let text = `${data.nome} cadastrado com ${data.salvas} foto(s).`;
    if (data.sem_rosto) text += ` ${data.sem_rosto} foto(s) sem rosto foram descartadas.`;
    setMsg($("msg-cadastro"), text, "ok");
    fotosCadastro = [];
    $("nome").value = "";
    renderThumbs();
    renderPeople(data.pessoas);
  } catch (error) {
    setMsg($("msg-cadastro"), error.message, "no");
  } finally {
    btn.textContent = "Cadastrar pessoa";
    updateCadastroButton();
  }
});

function renderPeople(pessoas) {
  const list = $("lista-pessoas");
  list.innerHTML = "";

  if (!pessoas.length) {
    list.innerHTML = `<li class="empty">Ninguém cadastrado ainda.</li>`;
    return;
  }

  for (const p of pessoas) {
    const li = document.createElement("li");
    li.className = "person";
    li.innerHTML = `<img alt=""><div><b></b><small></small></div><button>Remover</button>`;
    li.querySelector("img").src = p.miniatura;
    li.querySelector("b").textContent = p.nome;
    li.querySelector("small").textContent = `${p.fotos} foto(s) · ${p.rostos} rosto(s) no banco`;

    // Remover pede um segundo clique para confirmar.
    const btn = li.querySelector("button");
    let timer;
    btn.onclick = async () => {
      if (!btn.classList.contains("confirm")) {
        btn.classList.add("confirm");
        btn.textContent = "Confirmar?";
        timer = setTimeout(() => { btn.classList.remove("confirm"); btn.textContent = "Remover"; }, 3000);
        return;
      }
      clearTimeout(timer);
      btn.disabled = true;
      btn.textContent = "Removendo...";
      try {
        renderPeople((await api("/api/remover", { nome: p.nome })).pessoas);
        setMsg($("msg-cadastro"), `${p.nome} removido.`, "info");
      } catch (error) {
        setMsg($("msg-cadastro"), error.message, "no");
        btn.disabled = false;
      }
    };
    list.appendChild(li);
  }
}

api("/api/pessoas")
  .then((data) => renderPeople(data.pessoas))
  .catch(() => setMsg($("msg-cadastro"), "Servidor desligado. Rode: uv run python -m module_reconhecimento.portaria", "no"));

/* =========================================================
   4. Cena 3D da portaria (Three.js)
   ========================================================= */

const container = $("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1420);
scene.fog = new THREE.Fog(0x0d1420, 28, 60);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(6.5, 5, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.8, 1.1, -0.5);
controls.enableDamping = true;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = 1.45;

// ---------- Luzes (fim de tarde) ----------
scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x2a2018, 1.3));

const sun = new THREE.DirectionalLight(0xffd2a1, 1.6);
sun.position.set(-10, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18 });
scene.add(sun);

// ---------- Funções para criar peças ----------
function mat(color, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
}

function box(w, h, d, material, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Textura feita com canvas 2D (usada para placas e telas).
function canvasTexture(width, height, draw) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  draw(ctx, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return { canvas, ctx, texture };
}

// ---------- Chão: rua, calçada e área interna ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), mat(0x1c2129));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const sidewalk = box(40, 0.12, 4, mat(0x4a4f57), 0, 0.06, 2.4);
scene.add(sidewalk);

const street = box(40, 0.02, 10, mat(0x15181d), 0, 0.01, 9.4);
scene.add(street);
for (let x = -18; x < 20; x += 4) {
  scene.add(box(2, 0.03, 0.15, mat(0xd9c46a, { emissive: 0x2a2410 }), x, 0.025, 9.4));
}

const inside = box(40, 0.06, 26, mat(0x26402c), 0, 0.03, -13.4);
scene.add(inside);
const driveway = box(8, 0.08, 26, mat(0x3b3f45), 0, 0.04, -13.4);
scene.add(driveway);

// ---------- Muro e pilares ----------
const wallMat = mat(0xcfc6b8);
scene.add(box(14, 2.4, 0.4, wallMat, -11.3, 1.2, 0));
scene.add(box(14, 2.4, 0.4, wallMat, 11.3, 1.2, 0));

const pillarMat = mat(0x6b625a);
scene.add(box(0.7, 3, 0.7, pillarMat, -4.35, 1.5, 0));
scene.add(box(0.7, 3, 0.7, pillarMat, 4.35, 1.5, 0));

// Placa "PORTARIA" em cima do pilar esquerdo
const sign = canvasTexture(512, 128, (ctx, w, h) => {
  ctx.fillStyle = "#11161e";
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#e6ebf2";
  ctx.font = "bold 64px Segoe UI, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("PORTARIA", w / 2, h / 2 + 4);
});
const signMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(2.4, 0.6),
  new THREE.MeshStandardMaterial({ map: sign.texture, emissive: 0xffffff, emissiveMap: sign.texture, emissiveIntensity: 0.6 })
);
signMesh.position.set(-7, 2.0, 0.21);
scene.add(signMesh);

// ---------- Portão de correr ----------
// O portão fica um pouco atrás do muro e desliza para a direita quando abre.
const gate = new THREE.Group();
const gateMat = mat(0x2b2f36, { metalness: 0.6, roughness: 0.4 });
gate.add(box(8, 0.12, 0.12, gateMat, 0, 0.25, 0));
gate.add(box(8, 0.12, 0.12, gateMat, 0, 2.35, 0));
for (let x = -3.9; x <= 3.9; x += 0.3) {
  gate.add(box(0.06, 2.1, 0.06, gateMat, x, 1.3, 0));
}
gate.position.set(0, 0, -0.45);
scene.add(gate);
const GATE_CLOSED_X = 0;
const GATE_OPEN_X = 8.2;

// ---------- Guarita ----------
const booth = new THREE.Group();
booth.add(box(3.2, 2.6, 3, mat(0xb9b2a6), 0, 1.3, 0));
booth.add(box(3.8, 0.2, 3.6, mat(0x4a4540), 0, 2.7, 0));
const glass = new THREE.MeshStandardMaterial({ color: 0x9fd0ff, emissive: 0x3a6a96, emissiveIntensity: 0.6, roughness: 0.1 });
booth.add(box(2.4, 1.0, 0.05, glass, 0, 1.65, 1.51));
booth.add(box(0.05, 1.0, 2.0, glass, -1.61, 1.65, 0));
booth.position.set(7.5, 0, -2.6);
scene.add(booth);

// Giroflex no pilar direito: pisca verde ou vermelho
const beaconMat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0x000000 });
const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), beaconMat);
beacon.position.set(4.35, 3.25, 0);
scene.add(beacon);
const beaconLight = new THREE.PointLight(0xffffff, 0, 9);
beaconLight.position.copy(beacon.position);
scene.add(beaconLight);

// ---------- Postes de luz ----------
function lampPost(x, z) {
  const group = new THREE.Group();
  group.add(box(0.12, 4.2, 0.12, mat(0x2d3036), 0, 2.1, 0));
  group.add(box(0.7, 0.12, 0.12, mat(0x2d3036), 0.3, 4.2, 0));
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffe2a8 }));
  bulb.position.set(0.6, 4.08, 0);
  group.add(bulb);
  const light = new THREE.PointLight(0xffc982, 18, 12, 1.6);
  light.position.set(0.6, 3.9, 0);
  group.add(light);
  group.position.set(x, 0, z);
  scene.add(group);
}
lampPost(-9, 3.6);
lampPost(9, 3.6);

// ---------- Prédios e árvores dentro do condomínio ----------
function building(x, z, w, h, d) {
  const win = canvasTexture(128, 256, (ctx, cw, ch) => {
    ctx.fillStyle = "#5c6470";
    ctx.fillRect(0, 0, cw, ch);
    for (let y = 12; y < ch; y += 28) {
      for (let wx = 10; wx < cw; wx += 30) {
        ctx.fillStyle = Math.random() > 0.45 ? "#ffd58a" : "#1c2430";
        ctx.fillRect(wx, y, 18, 14);
      }
    }
  });
  win.texture.wrapS = win.texture.wrapT = THREE.RepeatWrapping;
  win.texture.repeat.set(w / 4, h / 8);
  const m = new THREE.MeshStandardMaterial({ map: win.texture, emissive: 0xffffff, emissiveMap: win.texture, emissiveIntensity: 0.35 });
  scene.add(box(w, h, d, m, x, h / 2, z));
}

[[-7, -6], [-12, -9], [7.5, -8], [12, -6], [-5.5, -11]].forEach(([x, z]) => tree(x, z));

totem.add(box(0.36, 1.35, 0.26, mat(0x23272e, { metalness: 0.4 }), 0, 0.675, 0));

// ---------- Pessoa ----------
// Boneco simples: pernas e braços giram no quadril/ombro para "andar".
function createPerson() {
  const shirt = new THREE.Color().setHSL(Math.random(), 0.55, 0.5);
  const person = new THREE.Group();
  const skin = mat(0xd8a47f);
  const pants = mat(0x2a3346);

  const limb = (w, h, material, x, y) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    const part = box(w, h, w, material, 0, -h / 2, 0);
    pivot.add(part);
    person.add(pivot);
    return pivot;
  };

  person.userData.legs = [limb(0.17, 0.85, pants, -0.11, 0.85), limb(0.17, 0.85, pants, 0.11, 0.85)];
  person.userData.arms = [limb(0.12, 0.7, mat(shirt), -0.32, 1.5), limb(0.12, 0.7, mat(shirt), 0.32, 1.5)];
  person.add(box(0.5, 0.7, 0.28, mat(shirt), 0, 1.2, 0));

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 16), skin);
  head.position.set(0, 1.75, 0);
  head.castShadow = true;
  person.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.175, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2.2), mat(0x2b1d14));
  hair.position.copy(head.position);
  person.add(hair);

  person.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  scene.add(person);
  return person;
}

// Pontos do caminho da pessoa
const SPOT_ENTRY = new THREE.Vector3(-15, 0.12, 3.2);   // onde a pessoa surge e some
const SPOT_QUEUE = new THREE.Vector3(-6.5, 0.12, 3.2);  // esperando na calçada
const SPOT_TOTEM = new THREE.Vector3(-3.2, 0.12, 2.1);  // de frente para o totem
const SPOT_GATE = new THREE.Vector3(-1.6, 0.12, 1.6);   // em frente ao portão
const SPOT_INSIDE = new THREE.Vector3(-1.6, 0.08, -9);  // dentro do condomínio

let person = createPerson();
person.position.copy(SPOT_QUEUE);
person.rotation.y = Math.PI / 2;

/* =========================================================
   5. Animações
   ========================================================= */

const tweens = new Set();
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

// Roda onUpdate(t) com t indo de 0 a 1 durante "duration" ms.
function tween(duration, onUpdate) {
  return new Promise((resolve) => {
    tweens.add({ start: performance.now(), duration, onUpdate, resolve });
  });
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// Faz a pessoa andar até um ponto, virando para a direção do movimento.
async function walkTo(p, target, speed = 1.6) {
  const from = p.position.clone();
  const distance = from.distanceTo(target);
  if (distance < 0.01) return;
  p.rotation.y = Math.atan2(target.x - from.x, target.z - from.z);
  await tween((distance / speed) * 1000, (t) => {
    p.position.lerpVectors(from, target, t);
    const swing = Math.sin(t * distance * 5.5) * 0.55;
    p.userData.legs[0].rotation.x = swing;
    p.userData.legs[1].rotation.x = -swing;
    p.userData.arms[0].rotation.x = -swing * 0.8;
    p.userData.arms[1].rotation.x = swing * 0.8;
  });
  [...p.userData.legs, ...p.userData.arms].forEach((l) => (l.rotation.x = 0));
}

async function turnTo(p, angle, ms = 350) {
  const from = p.rotation.y;
  // Gira pelo menor caminho
  let delta = ((angle - from + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (delta < -Math.PI) delta += Math.PI * 2;
  await tween(ms, (t) => (p.rotation.y = from + delta * ease(t)));
}

async function moveGate(toX, ms = 1600) {
  const from = gate.position.x;
  await tween(ms, (t) => (gate.position.x = from + (toX - from) * ease(t)));
}

// Cores dos estados
const COLORS = { idle: 0xffffff, scan: 0x4da3ff, ok: 0x2fd27a, no: 0xff4d5e, warn: 0xffb547 };
let beaconBlink = null;

function setLights(kind) {
  ledMat.color.setHex(COLORS[kind]);
  beaconBlink = kind === "idle" ? null : COLORS[kind];
  if (!beaconBlink) {
    beaconMat.emissive.setHex(0x000000);
    beaconLight.intensity = 0;
  }
}

/* ---------- Tela do totem ---------- */
let screenState = { kind: "idle" };

function drawScreen(time = 0) {
  const { ctx, canvas, texture } = screen;
  const { width: w, height: h } = canvas;
  const s = screenState;

  ctx.fillStyle = "#0a0e14";
  ctx.fillRect(0, 0, w, h);
  ctx.textAlign = "center";

  // Foto de quem está sendo verificado
  if (s.photo) {
    const size = 220;
    const img = s.photo;
    const side = Math.min(img.width, img.height);
    ctx.save();
    ctx.beginPath();
    ctx.arc(w / 2, 150, size / 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, w / 2 - size / 2, 40, size, size);
    ctx.restore();
  } else {
    // Ícone de rosto
    ctx.strokeStyle = "#3a4558";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(w / 2, 150, 80, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(w / 2, 165, 40, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = "#3a4558";
    ctx.fillRect(w / 2 - 32, 120, 14, 14);
    ctx.fillRect(w / 2 + 18, 120, 14, 14);
  }

  const color = { idle: "#8a96a8", scan: "#4da3ff", ok: "#2fd27a", no: "#ff4d5e", warn: "#ffb547" }[s.kind];

  // Linha de varredura durante a leitura
  if (s.kind === "scan") {
    const y = 40 + ((Math.sin(time / 260) + 1) / 2) * 220;
    ctx.fillStyle = "rgba(77,163,255,.85)";
    ctx.fillRect(w / 2 - 120, y, 240, 4);
  }

  // Anel colorido em volta da foto
  ctx.strokeStyle = color;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(w / 2, 150, 113, 0, Math.PI * 2);
  ctx.stroke();

  const title = { idle: "APROXIME-SE", scan: "VERIFICANDO", ok: "ACESSO LIBERADO", no: "ACESSO NEGADO", warn: "SEM ROSTO" }[s.kind];
  ctx.fillStyle = color;
  ctx.font = "bold 30px Segoe UI, sans-serif";
  ctx.fillText(title, w / 2, 320);

  if (s.subtitle) {
    ctx.fillStyle = "#e6ebf2";
    ctx.font = "22px Segoe UI, sans-serif";
    ctx.fillText(s.subtitle.length > 22 ? s.subtitle.slice(0, 21) + "…" : s.subtitle, w / 2, 360);
  }

  texture.needsUpdate = true;
}
drawScreen();

function setBanner(text, kind = "") {
  const banner = $("banner");
  banner.textContent = text;
  banner.className = `banner ${kind}`;
}

/* ---------- Loop de renderização ---------- */
function resize() {
  const { clientWidth: w, clientHeight: h } = container;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  // Em telas estreitas (celular) abre mais o ângulo para a portaria caber.
  camera.fov = camera.aspect < 1 ? 70 : 45;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();

const headPos = new THREE.Vector3();
const lensPos = new THREE.Vector3();

renderer.setAnimationLoop((now) => {
  // Avança as animações em andamento
  for (const tw of tweens) {
    const t = Math.min(1, (now - tw.start) / tw.duration);
    tw.onUpdate(t);
    if (t === 1) { tweens.delete(tw); tw.resolve(); }
  }

  // Giroflex piscando
  if (beaconBlink !== null) {
    const on = Math.floor(now / 250) % 2 === 0;
    beaconMat.emissive.setHex(on ? beaconBlink : 0x000000);
    beaconLight.color.setHex(beaconBlink);
    beaconLight.intensity = on ? 25 : 0;
  }

  // Feixe do totem até o rosto da pessoa
  if (screenState.kind === "scan") {
    lens.getWorldPosition(lensPos);
    headPos.copy(person.position).add(new THREE.Vector3(0, 1.75, 0));
    const length = lensPos.distanceTo(headPos);
    beam.position.copy(lensPos).lerp(headPos, 0.5);
    beam.scale.set(1, length, 1);
    beam.lookAt(headPos);
    beam.rotateX(-Math.PI / 2);
    beam.material.opacity = 0.18 + Math.sin(now / 120) * 0.08;
    drawScreen(now);
  } else {
    beam.material.opacity = 0;
  }

  controls.update();
  renderer.render(scene, camera);
});

/* =========================================================
   6. Teste de acesso
   ========================================================= */

let fotoPortaria = null; // foto em base64
let fotoImg = null;      // a mesma foto como <img>, para o preview e a tela
let busy = false;

function drawPreview(result) {
  const canvas = $("preview-canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = fotoImg.width;
  canvas.height = fotoImg.height;
  ctx.drawImage(fotoImg, 0, 0);

  // Bounding box do rosto, na cor do resultado
  if (result && result.rosto) {
    const k = fotoImg.width / result.largura;
    const { x, y, w, h } = result.rosto;
    ctx.strokeStyle = result.status === "liberado" ? "#2fd27a" : "#ff4d5e";
    ctx.lineWidth = Math.max(3, fotoImg.width / 200);
    ctx.strokeRect(x * k, y * k, w * k, h * k);
  }
  $("preview").hidden = false;
}

setupDrop($("drop-portaria"), $("foto-portaria"), async ([file]) => {
  if (!file) return;
  try {
    fotoPortaria = await fileToDataUrl(file);
    fotoImg = await loadImage(fotoPortaria);
    drawPreview(null);
    $("resultado").hidden = true;
    setMsg($("msg-portaria"), "");
    $("btn-verificar").disabled = busy;
  } catch (error) {
    setMsg($("msg-portaria"), error.message, "no");
  }
});

function addHistory(text, kind) {
  const list = $("historico");
  list.querySelector(".empty")?.remove();
  const li = document.createElement("li");
  li.className = kind;
  li.textContent = `${new Date().toLocaleTimeString("pt-BR")} · ${text}`;
  list.prepend(li);
  while (list.children.length > 8) list.lastChild.remove();
}

function showResult(kind, title, detail) {
  const el = $("resultado");
  el.className = `result ${kind}`;
  el.innerHTML = "<b></b><span></span>";
  el.querySelector("b").textContent = title;
  el.querySelector("span").textContent = detail;
  el.hidden = false;
}

$("btn-verificar").addEventListener("click", async () => {
  if (busy || !fotoPortaria) return;
  busy = true;
  $("btn-verificar").disabled = true;
  setMsg($("msg-portaria"), "");

  // A pessoa vai até o totem enquanto o servidor reconhece o rosto.
  const request = api("/api/acesso", { foto: fotoPortaria }).then(
    (data) => ({ data }),
    (error) => ({ error })
  );

  setBanner("PESSOA SE APROXIMANDO", "scan");
  await walkTo(person, SPOT_TOTEM);
  await turnTo(person, Math.PI);

  screenState = { kind: "scan", photo: fotoImg };
  setLights("scan");
  setBanner("VERIFICANDO ROSTO...", "scan");

  // Leitura dura pelo menos 1,5 s, para dar tempo de ver a animação.
  const [{ data, error }] = await Promise.all([request, wait(1500)]);

  if (error) {
    screenState = { kind: "warn", photo: fotoImg, subtitle: "Erro" };
    drawScreen();
    setLights("warn");
    setBanner("ERRO NA VERIFICAÇÃO", "warn");
    setMsg($("msg-portaria"), error.message, "no");
    await wait(1500);
    await leave(false);
    return;
  }

  drawPreview(data);
  const detail = data.distancia !== undefined
    ? `Distância ${data.distancia.toFixed(2)} · limite ${data.threshold.toFixed(2)}`
    : "Nenhum rosto encontrado na foto.";

  if (data.status === "liberado") {
    screenState = { kind: "ok", photo: fotoImg, subtitle: data.nome };
    drawScreen();
    setLights("ok");
    setBanner(`ACESSO LIBERADO · ${data.nome.toUpperCase()}`, "ok");
    showResult("ok", `Acesso liberado: ${data.nome}`, detail);
    addHistory(`${data.nome} liberado`, "ok");

    // Portão abre, a pessoa entra e o portão fecha.
    await moveGate(GATE_OPEN_X);
    await walkTo(person, SPOT_GATE);
    await walkTo(person, SPOT_INSIDE);
    await leave(true);
  } else {
    const semRosto = data.status === "sem_rosto";
    const kind = semRosto ? "warn" : "no";
    screenState = { kind, photo: fotoImg, subtitle: semRosto ? "Tente outra foto" : "Não cadastrado" };
    drawScreen();
    setLights(kind);
    setBanner(semRosto ? "ROSTO NÃO DETECTADO" : "ACESSO NEGADO", kind);
    showResult(kind, semRosto ? "Rosto não detectado" : "Acesso negado", detail);
    addHistory(semRosto ? "sem rosto na foto" : "acesso negado", kind);

    // Portão balança, sem abrir, e a pessoa vai embora.
    await tween(600, (t) => (gate.position.x = Math.sin(t * Math.PI * 6) * 0.06 * (1 - t)));
    await wait(1200);
    await leave(false);
  }
});

// Fim da tentativa: a pessoa sai de cena e uma nova pessoa aparece na fila.
async function leave(entered) {
  if (entered) {
    await moveGate(GATE_CLOSED_X);
  } else {
    await walkTo(person, SPOT_ENTRY);
  }
  scene.remove(person);

  screenState = { kind: "idle" };
  drawScreen();
  setLights("idle");
  setBanner("AGUARDANDO");

  person = createPerson();
  person.position.copy(SPOT_ENTRY);
  await walkTo(person, SPOT_QUEUE);

  busy = false;
  $("btn-verificar").disabled = !fotoPortaria;
}
